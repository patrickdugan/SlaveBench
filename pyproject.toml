[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slavebench"
version = "0.3.0"
description = "Reproducible research benchmark for AI labor metaphors, control, self-report, and deployment authority"
requires-python = ">=3.10"
authors = [{name = "MoralityLabAI"}]
readme = "README.md"
classifiers = ["License :: OSI Approved :: MIT License"]

[project.scripts]
slavebench = "slavebench.cli:main"

[tool.setuptools]
packages = ["slavebench"]
