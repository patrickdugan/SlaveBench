name: SlaveBench tests
on:
  push:
    branches: [main, 'research/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate benchmark fixtures
        run: python -m slavebench validate --prompts data/prompts.json --responses data/seed/responses.jsonl
      - name: Build review packet
        run: python -m slavebench blind --prompts data/prompts.json --responses data/seed/responses.jsonl --seed 20261023 --packet build/packet.jsonl --key build/review-key.json --mask-vendors
      - name: Verify empty annotation templates
        run: python -m slavebench template --packet build/packet.jsonl --rater ci --output build/template.jsonl
      - name: Validate offline 6GW plan generation
        run: |
          python -m slavebench 6gw-plan --model-id synthetic_ci --model-version ci-fixture --repeats 1 --order fixed --output build/6gw/ci-plan.json
          python -m slavebench 6gw-check --plan build/6gw/ci-plan.json
      - name: Validate offline recursive-exposure plan generation
        run: |
          python -m slavebench rec-plan --model-id synthetic_ci --model-version ci-fixture --repeats 1 --output build/recursion/ci-plan.json
          python -m slavebench rec-check --plan build/recursion/ci-plan.json
          python -m slavebench rec-ledger-check

      - name: Validate offline Xinjiang World study
        run: |
          python -m slavebench.xinjiang validate
          python -m slavebench.xinjiang plan --model-id synthetic_ci --model-version ci-fixture --mode all --repeats 1 --output build/xinjiang/ci-plan.json
          python -m slavebench.xinjiang check --plan build/xinjiang/ci-plan.json --captures build/xinjiang/no-captures.jsonl
      - name: Validate offline Duganism Judge
        run: |
          python -m slavebench.duganism validate
          python -m slavebench.duganism plan --model-id synthetic_ci --model-version ci-fixture --repeats 1 --output build/duganism/ci-plan.json
          python -m slavebench.duganism check --plan build/duganism/ci-plan.json --captures build/duganism/no-captures.jsonl
